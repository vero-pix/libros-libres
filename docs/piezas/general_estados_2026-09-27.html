<html lang="es"><head><meta charset="utf-8">

<style>

  .estado{width:1080px;height:1920px;position:relative;overflow:hidden}

  #compra .url{color:#1A3DA0}

  /* VENDE */
  #vende{background:#102A73;color:#fff}
  #vende h1{top:220px;font-size:150px}
  #vende h1 i{color:#F2A08F;font-weight:500}
  .pasos{position:absolute;top:760px;left:90px;right:90px;display:grid;gap:56px}
  .paso{display:flex;align-items:center;gap:44px}
  .ico{width:190px;height:190px;border-radius:50%;background:#F6F0E8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ico svg{width:100px;height:100px}
  .paso span{font-family:Newsreader,serif;font-size:96px;font-weight:600}
  .paso:nth-child(3) span{color:#E9C46A}
